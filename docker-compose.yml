# Local full stack: http://localhost:8080
#   1. ./scripts/download_vectors.sh && python3 scripts/clean_vocab.py
#   2. docker compose up --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - VECTORS_PATH=/app/data/wiki.kk.clean.vec
      - CACHE_PATH=/app/data/kk_vectors.npz
      - ALLOW_DUMMY_VECTORS=${ALLOW_DUMMY_VECTORS:-0}
      - SECRET_KEY=${SECRET_KEY:-local-dev-key}
      - ALLOWED_ORIGINS=http://localhost:8080
    volumes:
      - ./data:/app/data   # vectors + cache persist between rebuilds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # first start parses the .vec file

  frontend:
    build: ./frontend      # nginx proxies /api → backend, so no API URL is needed
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
